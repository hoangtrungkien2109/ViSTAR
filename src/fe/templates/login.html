{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-100 via-white to-blue-100 px-4">
    <div class="card max-w-md w-full shadow-lg rounded-xl bg-white p-8">
        <div class="card-header">
            <h2 class="text-2xl font-extrabold text-gray-900 mb-6 text-center">Login to ViSTAR</h2>
        </div>
        <div class="card-body">
            {% if error_msg %}
                <div class="alert alert-error">
                    {{ error_msg }}
                </div>
            {% endif %}
            {% if msg %}
                <div class="alert alert-success">
                    {{ msg }}
                </div>
            {% endif %}

            <form action="/login" method="post" class="space-y-6">
                <div class="form-group">
                    <label class="form-label" for="username">Username:</label>
                    <input type="text" name="username" id="username" class="form-input" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password:</label>
                    <input type="password" name="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-full text-lg font-semibold transition duration-200 hover:bg-blue-700 focus:ring-blue-500">Login</button>
            </form>

            <p class="mt-6 text-sm text-gray-600 text-center">
                Don't have an account?
                <a href="/register" class="text-blue-600 hover:underline">Register</a>
            </p>
            <p class="mt-2 text-center">
                <a href="/forgot-password" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
